<div class="min-h-screen bg-background flex flex-col">
  <!-- Header -->
  <header class="sticky top-0 z-50 bg-card border-b border-border shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <!-- Logo -->
        <a routerLink="/" class="flex items-center gap-2">
          <img src="/logo.png" alt="StreetLeague" class="h-12 w-auto" />
        </a>

        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center gap-2">
          <a *ngFor="let item of navItems" [routerLink]="item.path"
            routerLinkActive="bg-primary/10 text-primary font-semibold"
            [routerLinkActiveOptions]="{exact: item.path === '/'}"
            class="flex items-center gap-2 px-4 py-2 rounded-xl transition-all text-muted-foreground hover:bg-muted hover:text-foreground"
            [class.bg-primary/10]="false" [class.text-primary]="false" [class.font-semibold]="false">
            <lucide-icon [img]="item.icon" class="h-4 w-4"></lucide-icon>
            <span>{{ item.label }}</span>
          </a>
        </nav>

        <!-- Auth Buttons -->
        <div class="hidden md:flex items-center gap-3">
          <a routerLink="/auth/login"
            class="px-4 py-2 text-foreground hover:text-primary transition-colors font-semibold flex items-center gap-2">
            <lucide-icon [img]="LogInIcon" class="h-4 w-4"></lucide-icon>
            Connexion
          </a>
          <a routerLink="/auth/signup"
            class="px-6 py-2 bg-primary text-primary-foreground rounded-xl font-semibold hover:bg-primary/90 transition-all shadow-md hover:shadow-lg">
            S'inscrire
          </a>
        </div>

        <!-- Mobile Menu Button -->
        <button (click)="toggleMobileMenu()" class="md:hidden p-2 rounded-lg hover:bg-muted transition-all">
          <lucide-icon *ngIf="mobileMenuOpen" [img]="XIcon" class="h-6 w-6"></lucide-icon>
          <lucide-icon *ngIf="!mobileMenuOpen" [img]="MenuIcon" class="h-6 w-6"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="mobileMenuOpen" class="md:hidden border-t border-border bg-card">
      <nav class="p-4 space-y-2">
        <a *ngFor="let item of navItems" [routerLink]="item.path"
          routerLinkActive="bg-primary/10 text-primary font-semibold"
          [routerLinkActiveOptions]="{exact: item.path === '/'}" (click)="closeMobileMenu()"
          class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-muted-foreground hover:bg-muted hover:text-foreground">
          <lucide-icon [img]="item.icon" class="h-5 w-5"></lucide-icon>
          <span>{{ item.label }}</span>
        </a>
        <div class="pt-4 border-t border-border space-y-2">
          <a routerLink="/auth/login" (click)="closeMobileMenu()"
            class="flex items-center justify-center gap-2 w-full px-4 py-3 text-foreground hover:bg-muted rounded-xl transition-all font-semibold">
            <lucide-icon [img]="LogInIcon" class="h-5 w-5"></lucide-icon>
            Connexion
          </a>
          <a routerLink="/auth/signup" (click)="closeMobileMenu()"
            class="flex items-center justify-center w-full px-4 py-3 bg-primary text-primary-foreground rounded-xl font-semibold hover:bg-primary/90 transition-all">
            S'inscrire
          </a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-secondary text-secondary-foreground py-12 border-t border-border">
    <div class="max-w-7xl mx-auto px-4">
      <div class="grid md:grid-cols-4 gap-8 mb-8">
        <div>
          <img src="/logo.png" alt="StreetLeague" class="h-10 w-auto mb-3" />
          <p class="text-sm text-muted-foreground">
            L'écosystème sportif amateur premium
          </p>
        </div>
        <div>
          <h4 class="font-semibold mb-4 text-secondary-foreground">Produit</h4>
          <ul class="space-y-2 text-sm">
            <li>
              <a routerLink="/browse" class="text-muted-foreground hover:text-primary transition-colors">
                Explorer
              </a>
            </li>
            <li>
              <a routerLink="/about" class="text-muted-foreground hover:text-primary transition-colors">
                Fonctionnalités
              </a>
            </li>
          </ul>
        </div>
        <div>
          <h4 class="font-semibold mb-4 text-secondary-foreground">Entreprise</h4>
          <ul class="space-y-2 text-sm">
            <li>
              <a routerLink="/about" class="text-muted-foreground hover:text-primary transition-colors">
                À propos
              </a>
            </li>
            <li>
              <a routerLink="/contact" class="text-muted-foreground hover:text-primary transition-colors">
                Contact
              </a>
            </li>
          </ul>
        </div>
        <div>
          <h4 class="font-semibold mb-4 text-secondary-foreground">Légal</h4>
          <ul class="space-y-2 text-sm">
            <li>
              <a href="#" class="text-muted-foreground hover:text-primary transition-colors">
                Confidentialité
              </a>
            </li>
            <li>
              <a href="#" class="text-muted-foreground hover:text-primary transition-colors">
                Conditions
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="border-t border-border/20 pt-8 text-center text-sm text-muted-foreground">
        <p>© 2026 StreetLeague. Tous droits réservés.</p>
      </div>
    </div>
  </footer>
</div>
